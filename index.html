<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The hero background is the first big thing on screen (the LCP element): start
         downloading it immediately, at high priority, in the size this screen uses. -->
    <link rel="preload" as="image" href="/images/home/hero-sm.webp" type="image/webp" media="(max-width: 767px)" fetchpriority="high">
    <link rel="preload" as="image" href="/images/home/hero.webp" type="image/webp" media="(min-width: 768px)" fetchpriority="high">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Google Fonts loaded without blocking the first paint: fetched as a preload, then
         switched to a stylesheet once it arrives (text shows in a fallback font until then,
         thanks to display=swap). <noscript> keeps it working with JS off. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Amethysta&family=Metamorphous&family=Raleway:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amethysta&family=Metamorphous&family=Raleway:wght@400;500;600;700&display=swap"></noscript>
    <title>Timeline — Free History Courses</title>
    <!-- SEO + link previews. These are the defaults (what crawlers and social apps see
         before JS runs); the router updates them per page (src/utils/pageMeta.js). -->
    <meta name="description" content="Learn history for free with Timeline: courses with illustrated lessons, quizzes to test yourself, a history blog and a daily &quot;on this day&quot; event." />
    <meta name="theme-color" content="#606C38" />
    <link rel="canonical" href="https://timeline.appwrite.network/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Timeline" />
    <meta property="og:title" content="Timeline — Free History Courses" />
    <meta property="og:description" content="Learn history for free with Timeline: courses with illustrated lessons, quizzes to test yourself, a history blog and a daily &quot;on this day&quot; event." />
    <meta property="og:url" content="https://timeline.appwrite.network/" />
    <meta property="og:image" content="https://timeline.appwrite.network/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
